provider: prerenderbuddy
source:
  docs: https://prerenderbuddy.com/developer-api
  openapi: https://api.prerenderbuddy.com/v1/developer/openapi.json
  curated: '2026-10-02'
pricing_url: https://prerenderbuddy.com/pricing
limits: Requires a workspace with Developer API entitlement and a scoped key. These GET operations read
  existing workspace evidence; they do not run AI collections, fresh renders or article generation. Read-only
  calls have no additional per-call charge. Workspace subscription and site limits apply; public per-key
  request-rate limits are not documented.
proposed_capabilities:
  web.sites.list: List websites registered in your connected workspace
  web.delivery.logs: Read recent website rendering and delivery logs
  web.site.overview: Read saved website setup, monitoring and visibility context
  web.monitoring.evidence: Read saved website health checks, incidents and discovery-file findings
  web.crawlers.activity: Read recorded crawler visits grouped by platform and page
  web.improvements.recommendations: Read website improvements grounded in recorded evidence
  web.content.status: Read article-draft and publication-calendar metadata for a website
  web.content.ideas: List tracked questions with recorded evidence suitable for article proposals
endpoints:
- id: prerenderbuddy.sites
  capability: web.sites.list
  platform: web
  domain: account
  scope: own_account
  kind: account
  method: GET
  path: /sites
  name: List workspace websites
  summary: List registered sites available to the API key workspace.
  input:
    note: Requires the sites API key scope. Missing recorded evidence is not proof of a negative outcome.
  cost:
    type: free
    value: 0
    currency: USD
    unit: call
    source: docs
    source_url: https://prerenderbuddy.com/developer-api
    checked: '2026-10-02'
    confidence: documented
    note: Included reads for an entitled connected workspace; a subscription is required. No fresh render
      or article-draft allowance is consumed. BYOK only; no shared-platform workspace data.
  docs_url: https://prerenderbuddy.com/developer-api
  test_request:
    queryParams: {}
